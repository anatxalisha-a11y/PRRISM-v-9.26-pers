name: Monthly Canadian FR primary source watch

on:
  schedule:
    - cron: "0 13 1 * *"  # 1st of the month, 13:00 UTC
  workflow_dispatch: {}   # manual re-run button in the Actions tab

jobs:
  watch:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only; the "Commit updated dedup state"
    # step below needs write access to push state/seen.json and
    # state/zotero_seen.json back to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r prrism-watch/requirements.txt

      - name: Run sourcing pipeline
        working-directory: prrism-watch
        run: python -m sourcing.run_pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Commit updated dedup state
        run: |
          git config user.name "prrism-watch-bot"
          git config user.email "actions@github.com"
          git add prrism-watch/state/seen.json prrism-watch/state/zotero_seen.json
          git diff --cached --quiet || git commit -m "chore(prrism-watch): update dedup state"
          git push
